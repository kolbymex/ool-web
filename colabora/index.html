/* Logo, una foto larga, due pannelli con il testo sopra. Palette "Notte tropicale" dell'app, un solo tema scuro voluto. */
:root{
  color-scheme:dark;
  --bg:#16353F; --bg-2:#1A3E49; --bg-3:#112C35;
  --gold:#E8B24D; --cream:#F5EFE2; --text:#EDE7DA; --muted:#93AEAA; --dim:#6E8B87;
  --line:rgba(232,178,77,.16); --line-2:rgba(232,178,77,.45);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6;font-weight:300;-webkit-font-smoothing:antialiased;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));
  background:radial-gradient(90% 38% at 50% 0%, rgba(232,178,77,.12), transparent 62%),linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 55%,var(--bg-3) 100%);background-color:var(--bg)}
.wrap{max-width:1160px;margin:0 auto}
h1,h2{font-family:var(--serif);font-weight:300;margin:0;color:var(--cream);text-wrap:balance;line-height:1.08}
p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

.langs{position:absolute;top:calc(18px + env(safe-area-inset-top, 0px));right:max(20px, env(safe-area-inset-right, 0px));display:flex;gap:2px;border:1px solid var(--line-2);border-radius:999px;padding:3px}
.langs button{font:500 13px/1 var(--sans);letter-spacing:.1em;border:0;background:none;color:var(--dim);padding:10px 13px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:rgba(232,178,77,.16);color:var(--gold)}

header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-block:72px 48px}
.logo{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px}
.logo svg{width:104px;height:auto;display:block}
.logo img{height:52px;width:auto;display:block}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(40px,6vw,72px);letter-spacing:-.01em;max-width:13ch}
h1 em{display:block;font-style:italic;color:var(--gold)}
.lede{font-size:18px;color:var(--muted);max-width:32em}

.band{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 85%;border-radius:22px}

.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:88px}
/* pannelli con le figure ritagliate: la figura sta in alto su un bagliore caldo, il testo sotto su fondo pieno.
   Ogni immagine è appoggiata al bordo dove è tagliata (la voce in basso a destra, l'handpan in alto a sinistra) */
.panel{position:relative;overflow:hidden;border-radius:22px;min-width:0;display:flex;flex-direction:column;
  background:radial-gradient(80% 50% at 62% 30%,rgba(232,178,77,.22),transparent 70%),linear-gradient(180deg,#0F2D36 0%,#0B2229 100%);
  box-shadow:0 30px 60px -34px rgba(0,0,0,.85)}
.panel .art{position:relative;aspect-ratio:10/9;overflow:hidden}
/* foto intere (la stanza e la luce fanno parte del racconto), sfumate in basso nel colore del pannello */
.panel .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.panel .art-voz img{object-position:50% 40%}
.panel .art-musica img{object-position:50% 55%}
.panel .art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(180deg,rgba(13,39,48,0),rgba(13,39,48,.7) 55%,#0D2730)}
.panel .tx{flex:1;padding:6px 32px 32px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.panel .cta{margin-top:auto}
.panel h2{font-size:clamp(34px,3.6vw,46px)}
.panel p{color:var(--text);font-size:17px;max-width:28em}
.panel .eyebrow{color:var(--gold);font-size:13px;letter-spacing:.12em;margin-bottom:-6px}
.cta{margin-top:6px;display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18px;text-decoration:none;color:var(--cream);
  border:1px solid var(--line-2);background:rgba(232,178,77,.18);padding:12px 22px;border-radius:999px;transition:border-color .3s,background .3s}
.cta:hover{border-color:var(--gold);background:rgba(232,178,77,.26)}
.cta[aria-disabled="true"]{opacity:.6;pointer-events:none}

html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* in alto, due tasti che portano giù a Voces e a Música; in fondo, una chiusura con i due pulsanti dei moduli */
.jump{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.jump a{font:500 15px/1 var(--sans);color:var(--cream);text-decoration:none;border:1px solid rgba(232,178,77,.45);border-radius:999px;padding:12px 18px;transition:border-color .3s}
.jump a:hover{border-color:var(--gold)}
.jump a [aria-hidden]{color:var(--gold);margin-left:6px}
.close{margin-top:88px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.close h2{font-size:clamp(32px,4vw,46px)}
.close p:not(.eyebrow){color:var(--muted);font-size:18px;max-width:30em;margin:0}
.close .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.close .cta{margin:0}

/* in fondo, per chi non manda né voce né musica: la lista della versione di prova */
.tester{margin-top:30px;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tester p{margin:0;color:var(--muted);font-size:16px}
.tester a{font-family:var(--serif);font-size:17px;color:var(--gold);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;padding:8px 4px}
.tester a:hover{text-decoration-thickness:2px}

/* sotto la prima foto: cosa vuol dire ÓOL, come una voce di dizionario */
.meaning{margin:44px auto 0;max-width:760px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.meaning .def b{font-style:normal;font-weight:400;color:var(--gold);letter-spacing:.02em}
.meaning .def{margin:0;font-family:var(--serif);font-style:italic;font-size:28px;line-height:1.45;color:var(--cream);text-wrap:balance}

/* dentro ÓOL: resta solo "Imparare di nuovo a respirare"; "Suoni veri" sta sopra la foto del cenote, le meditazioni nel carosello */
.inside .breathe{margin-top:18px;max-width:38em;font-size:23px;line-height:1.6;color:var(--text)}
.cenote{position:relative;margin:56px 0 0}
.cenote .band-cenote{margin-top:0}
.cenote::after{content:"";position:absolute;inset:0;border-radius:22px;background:linear-gradient(180deg,rgba(8,24,30,0) 45%,rgba(8,24,30,.82) 100%);pointer-events:none}
.cenote figcaption{position:absolute;left:36px;right:36px;bottom:30px;z-index:1;display:flex;flex-direction:column;gap:4px;max-width:30em}
.cenote figcaption b{font-family:var(--serif);font-weight:400;font-size:32px;color:var(--cream)}
.cenote figcaption span{font-size:20px;color:var(--text)}

/* dentro ÓOL: tre colonne di solo testo */
.inside{margin-top:88px}
.inside h2{font-size:clamp(32px,4vw,46px);margin-top:12px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin-top:36px}
.cols h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;color:var(--cream);line-height:1.2}
.cols p{margin-top:8px;color:var(--muted);font-size:17px}
/* la foto del cenote chiude "Dentro de ÓOL": larga, con il tamburo e il flauto a sinistra */
.band-cenote{margin-top:56px;aspect-ratio:21/9;object-position:50% 80%}
.extra{margin-top:36px;padding-top:22px;border-top:1px solid var(--line);font-family:var(--serif);font-size:24px;line-height:1.45;color:var(--cream)}
/* perché partecipare: un pannello come Voces e Música, i tre motivi a sinistra e la donna che respira a destra, appoggiata al bordo in basso dove è tagliata */
.why{margin-top:96px}
.why ul{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
.why-card{position:relative;overflow:hidden;border-radius:22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:end;
  background:radial-gradient(55% 75% at 76% 42%,rgba(232,178,77,.24),transparent 70%),linear-gradient(180deg,#0F2D36 0%,#0B2229 100%);box-shadow:0 30px 60px -34px rgba(0,0,0,.85)}
.why-card .why-tx{align-self:center;padding:52px 0 52px 52px}
.why-card ul{grid-template-columns:1fr;gap:26px}
.why-card .why-art{position:relative;padding:28px 26px 0 0}
.why-card .why-art img{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.why h3{font-family:var(--serif);font-weight:400;font-size:26px;margin:0;color:var(--cream);line-height:1.2}
.why li p{margin-top:6px;color:var(--muted);font-size:17px}
/* due telefoni visti di fronte, disegnati in CSS. Le misure interne sono quelle di un iPhone da 393 × 852 pt,
   espresse in --u (un punto dello schermo), così il telefono si scala con la colonna */
/* carosello: un telefono grande; le schermate scorrono da sole (ferme se si riduce il movimento),
   si spostano col dito o con le frecce, e l'elenco accanto dice cosa si sta guardando */
.gallery{margin-top:80px}
.carousel{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:64px;align-items:center;justify-content:center;max-width:900px;margin:0 auto}
.phone{margin:0;min-width:0;container-type:inline-size}
.phone .screen{touch-action:pan-y;user-select:none}
.track{display:flex;height:100%;transition:transform .7s cubic-bezier(.45,.05,.2,1)}
.slide{position:relative;flex:0 0 100%;height:100%;background:var(--bot,#081820)}
.slide::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(59 * var(--u));background:linear-gradient(90deg,var(--sb-side,#102227),var(--sb-mid,#1D2B29) 50%,var(--sb-side,#102227))}
.cap-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cap-list button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px 18px;border-radius:16px;border-left:2px solid transparent;transition:background .3s,border-color .3s}
.cap-list button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cap-list b{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--muted);transition:color .3s}
.cap-list span{font-size:16px;line-height:1.5;color:var(--muted);opacity:.75;transition:color .3s,opacity .3s}
.cap-list li.on button{background:rgba(232,178,77,.08);border-left-color:var(--gold)}
.cap-list li.on b{color:var(--cream)}
.cap-list li.on span{color:var(--text);opacity:1}
.nav{display:none;align-items:center;justify-content:center;gap:18px;margin-top:14px}
.arrow{border:1px solid var(--line-2);background:none;color:var(--cream);width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.arrow svg{width:24px;height:24px}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2);cursor:pointer}
.dots i.on{background:var(--gold)}
.phone .frame{padding:3.4cqw;border-radius:15cqw;background:linear-gradient(150deg,#465052,#1a2122 35%,#0d1314 70%,#2a3335);
  box-shadow:inset 0 0 0 .5cqw rgba(255,255,255,.07),0 34px 60px -30px rgba(0,0,0,.9)}
.phone .screen{--u:calc(93.2cqw / 393);position:relative;aspect-ratio:393/852;border-radius:11.6cqw;overflow:hidden;background:var(--bot,#081820)}
.phone .app{position:absolute;left:0;top:calc(59 * var(--u));width:100%;height:calc(759 * var(--u));display:block;max-width:none;object-fit:cover}
.phone .sb{position:absolute;left:0;top:0;width:100%;height:calc(59 * var(--u));pointer-events:none}
.phone .clock{position:absolute;left:0;width:calc(118 * var(--u));top:calc(17 * var(--u));text-align:center;font:600 calc(17 * var(--u))/1.4 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#fff}
.phone .island{position:absolute;left:calc(134 * var(--u));top:calc(11 * var(--u));width:calc(125 * var(--u));height:calc(37 * var(--u));border-radius:calc(19 * var(--u));background:#000}
.phone .icons{position:absolute;right:calc(26 * var(--u));top:calc(21 * var(--u));display:flex;gap:calc(6 * var(--u));align-items:center}
.phone .icons svg{display:block;height:calc(12 * var(--u));width:auto}
.phone .home{position:absolute;left:calc(129 * var(--u));bottom:calc(8 * var(--u));width:calc(135 * var(--u));height:calc(5 * var(--u));border-radius:calc(3 * var(--u));background:rgba(255,255,255,.82)}
footer{padding-block:88px 44px;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
footer .pyramid{color:var(--gold)}

@media (max-width:820px){
  .cols{grid-template-columns:1fr;gap:36px}
  .why{margin-top:72px}
  .why ul{grid-template-columns:1fr;gap:28px}
  /* su telefono le schermate scorrono di lato, una alla volta */
  /* su telefono: il telefono al centro, sotto solo la didascalia della schermata che si vede, i punti e le frecce */
  .carousel{grid-template-columns:1fr;gap:20px}
  .phone.big{width:min(78%,300px);justify-self:center}
  .cap-list{display:grid}
  .cap-list li{grid-area:1/1}
  .cap-list li:not(.on){visibility:hidden}
  .cap-list button{border-left:0;text-align:center;align-items:center;padding:6px 8px}
  .cap-list li.on button{background:none}
  .nav{display:flex}
  header{padding-block:76px 36px}
  .logo{gap:12px}
  .logo svg{width:80px}
  .logo img{height:40px}
  .band{aspect-ratio:4/3;object-position:30% 50%}
  .band-cenote{margin-top:40px;object-position:22% 50%}

   ?lang=en / ?lang=it (per esempio tornando da un modulo) la apre in quella lingua */
let lang = ({ en: "en", it: "it" })[new URLSearchParams(location.search).get("lang")] || "es";

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll("[data-i18n-label]").forEach(el=>{ el.setAttribute("aria-label", t[el.dataset.i18nLabel]); });
  [document.querySelector(".band"), ...document.querySelectorAll(".panel img")].forEach((img,i)=>{ img.alt = t.alt[i]; });
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  document.querySelectorAll("[data-form]").forEach(a=>{
    const u = FORMS[a.dataset.form];
    if(u){ a.href = FORM_LANG[a.dataset.form] && lang !== "es" ? u + "?lang=" + lang : u; a.removeAttribute("aria-disabled"); a.removeAttribute("tabindex");
      /* sul sito il modulo si apre nella stessa scheda, così "indietro" riporta qui; dentro una cornice (la copia su claude.ai) in una scheda nuova */
      if (window.top !== window.self) { a.target = "_blank"; a.rel = "noopener"; } }
    else { a.removeAttribute("href"); a.setAttribute("aria-disabled","true"); a.setAttribute("tabindex","-1"); }
  });
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{
  lang = b.dataset.lang;
  render();
});
render();

/* carosello: una schermata con un video resta finché il video finisce (la respirazione, che si ripete,
   per un respiro: 10 s), le altre 4,5 s. La respirazione parte da 0,5 s: il primo mezzo secondo è la
   dissolvenza che chiude il giro. Gli altri video partono dall'inizio e si fermano sull'ultimo fotogramma */
const track = document.getElementById("track"), screen = document.getElementById("screen");
const slides = [...track.querySelectorAll(".slide")];
const caps = [...document.querySelectorAll("#caps li")], dots = [...document.querySelectorAll("#dots i")];
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur = 0, timer = 0, held = false;
function video(i){ return slides[i].querySelector("video"); }
function show(i){
  cur = (i + slides.length) % slides.length;
  track.style.transform = `translateX(${-100 * cur}%)`;
  caps.forEach((c, k) => c.classList.toggle("on", k === cur));
  dots.forEach((d, k) => d.classList.toggle("on", k === cur));
  slides.forEach((s, k) => { const v = video(k); if (v && k !== cur) v.pause(); });
  const v = video(cur);
  if (v && !still) {
    if (!v.src) { v.src = v.dataset.src; v.load(); }
    try { v.currentTime = v.loop ? 0.5 : 0; } catch (e) {}
    v.play().catch(() => {});
  }
  schedule();
}
function schedule(){
  clearTimeout(timer);
  if (still || held) return;
  const v = video(cur);
  timer = setTimeout(() => show(cur + 1), !v || still ? 4500 : v.loop ? 9500 : 10000);
}
/* chi tocca prende il controllo: l'avanzamento automatico riparte dopo una pausa */
function pick(i){ held = true; show(i); clearTimeout(pick.t); pick.t = setTimeout(() => { held = false; schedule(); }, 9000); }
document.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", () => pick(+el.dataset.go)));
document.getElementById("prev").onclick = () => pick(cur - 1);
document.getElementById("next").onclick = () => pick(cur + 1);
let x0 = null;
screen.addEventListener("pointerdown", e => { x0 = e.clientX; });
screen.addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 30) pick(cur + (dx < 0 ? 1 : -1)); });
const car = document.querySelector(".carousel");
car.addEventListener("mouseenter", () => { held = true; clearTimeout(timer); });
car.addEventListener("mouseleave", () => { held = false; schedule(); });
/* il carosello parte quando lo si vede, non prima */
if ("IntersectionObserver" in window) {
  let started = false;
  new IntersectionObserver(es => { if (es[0].isIntersecting && !started) { started = true; show(0); } }, { threshold: .35 }).observe(car);
  caps[0].classList.add("on"); dots[0].classList.add("on");
} else show(0);
</script>
